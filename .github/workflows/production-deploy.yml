name: Deploy production

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact merged main commit to deploy
        required: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require the requested commit to be live main
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          [[ "$EXPECTED_REVISION" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_REVISION"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public routing before deploying
        run: node scripts/production-routing.mjs
      - name: Validate Cloudflare production credentials
        run: node scripts/cloudflare-production-credentials.mjs
        env:
          CLOUDFLARE_APITOKEN: ${{ secrets.CLOUDFLARE_APITOKEN }}
          CLOUDFLARE_ID: ${{ secrets.CLOUDFLARE_ID }}
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build production assets
        run: pnpm build
      - name: Recheck main before deployment
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_REVISION"
      - name: Save the live sitemap for IndexNow
        continue-on-error: true
        run: curl --fail --silent --show-error https://riftn.com/sitemap-static.xml --output /tmp/live-sitemap-static.xml
      - name: Deploy production worker and assets
        run: pnpm exec wrangler deploy --config wrangler.jsonc
      - name: Verify public routing after deploying
        run: node scripts/production-routing.mjs
      - name: Verify production serves this commit
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          # Cloudflare takes a few seconds to roll a new version out to every
          # edge, so the first read can still see the previous commit. Poll for
          # up to two minutes before calling it a failed deploy.
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error "https://riftn.com/version.json?commit=$EXPECTED_REVISION&try=$attempt" --output /tmp/production-version.json \
              && node -e 'const v=JSON.parse(require("fs").readFileSync("/tmp/production-version.json","utf8")); process.exit(v.id===process.env.EXPECTED_REVISION.slice(0,8)?0:1)'; then
              echo "Production serves $EXPECTED_REVISION"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production serves a different commit: $(cat /tmp/production-version.json 2>/dev/null)"
          exit 1
      - name: Ping search engines about changed pages
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs dist/sitemap-static.xml --previous /tmp/live-sitemap-static.xml
