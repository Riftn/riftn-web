name: cloud probe
on:
  push:
    branches: [claude/project-thread-wouq63]
    paths: [.github/workflows/cloud-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/cloudflare-credentials.mjs
        env:
          CLOUDFLARE_APITOKEN: ${{ secrets.CLOUDFLARE_APITOKEN }}
          CLOUDFLARE_ID: ${{ secrets.CLOUDFLARE_ID }}
      - run: |
          node --input-type=module <<'JS'
          const a = process.env.CLOUDFLARE_ACCOUNT_ID;
          const api = (p, i = {}) => fetch(`https://api.cloudflare.com/client/v4${p}`, { ...i, headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' } }).then(r => r.json());
          const show = (k, r) => console.log(k, JSON.stringify({ success: r.success, errors: r.errors, n: Array.isArray(r.result) ? r.result.length : undefined, names: Array.isArray(r.result) ? r.result.map(x => x.namespace_name || x.name || x.id).slice(0, 20) : undefined }));
          show('dispatch', await api(`/accounts/${a}/workers/dispatch/namespaces`));
          show('d1', await api(`/accounts/${a}/d1/database?per_page=50`));
          show('kv', await api(`/accounts/${a}/storage/kv/namespaces?per_page=50`));
          show('r2', await api(`/accounts/${a}/r2/buckets`));
          show('sub', await api(`/accounts/${a}/subscriptions`));
          show('tokenverify', await api(`/user/tokens/verify`));
          JS
