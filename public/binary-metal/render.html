<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Binary Metal</title></head><body>
<script type="module">
// The Riftn app draws Binary Metal riffs here, in a hidden WebView, with the
// same engine as riftn.com/music/binary-metal. It answers in chunks so a long
// riff never has to cross the bridge as one huge message.
import { render, toWav, toMp3 } from './engine.js?v=1';

const CHUNK = 512 * 1024;
function reply(payload) {
  const message = JSON.stringify({ type: 'binary-metal', ...payload });
  if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(message);
  else parent.postMessage(message, location.origin);
}
function base64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
let busy = false;
window.renderBinaryMetal = async (job) => {
  const id = job && typeof job.id === 'string' ? job.id : '';
  if (!id || busy) { reply({ id, error: 'busy' }); return; }
  busy = true;
  try {
    const opts = { style: job.style, bpm: job.bpm, tuning: job.tuning, power: job.power };
    const buffer = await render(String(job.text || ''), opts);
    const bytes = job.format === 'wav' ? toWav(buffer) : await toMp3(buffer);
    const b64 = base64(bytes);
    const total = Math.max(1, Math.ceil(b64.length / CHUNK));
    for (let i = 0; i < total; i++) {
      reply({ id, index: i, total, chunk: b64.slice(i * CHUNK, (i + 1) * CHUNK), mime: job.format === 'wav' ? 'audio/wav' : 'audio/mpeg', duration: buffer.duration });
      await new Promise((r) => setTimeout(r, 0));
    }
  } catch (error) {
    reply({ id, error: String((error && error.message) || error) });
  } finally {
    busy = false;
  }
};
reply({ ready: true, version: 1 });
</script></body></html>
