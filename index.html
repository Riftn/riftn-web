    <meta charset="UTF-8" />
    <!-- A post link asks for its post now, while the app code is still on its
         way, instead of after it has arrived and drawn the page (that wait was
         ~4 s on desktop, ~6 s on a mid phone). src/lib/post-prefetch.ts picks
         the answer up. Mirrors apiCall's headers; an expired sign-in is left to
         the app, which refreshes it first.

         It asks for the post page's code now too, and for the live player's
         the moment the answer says the post is a live. Those used to wait their
         turn: the post page was asked for once the app had run, the player
         once the post page had. The file lists are written in at build
         (postLinkCodePlugin, vite.config.ts); a dev server leaves the marker
         as it is and nothing extra is asked for. -->
    <script>
      (function () {
        try {
          var m = location.pathname.match(/^\/(?:app\/)?(?:post|video|posts)\/(\d+)(?:\/b(?:\/[^/]+)?)?\/?$/);
          var chat = /^\/chat\/?$/i.test(location.pathname);
          if (!m && !chat) return;
          var code = "__POST_LINK_CODE__";
          var conn = navigator.connection;
          if (typeof code !== 'object' || (conn && conn.saveData)) code = null;
          // Fetched and compiled only: nothing runs early.
          var want = function (files) {
            for (var i = 0; i < files.length; i++) {
              var href = '/' + files[i], css = /\.css$/.test(href);
              // Already asked for (the app got to it first, and writes whole
              // addresses): nothing to add.
              if (document.querySelector('link[href="' + href + '"],link[href="' + location.origin + href + '"]')) continue;
              var l = document.createElement('link');
              l.rel = css ? 'preload' : 'modulepreload';
              if (css) l.as = 'style';
              l.crossOrigin = '';
              l.href = href;
              document.head.appendChild(l);
            }
          };
          if (chat) {
            // The starter runs this after the HTML chat skeleton has painted.
            var chatCode = "__CHAT_LINK_CODE__";
            if (Array.isArray(chatCode) && !(conn && conn.saveData)) {
              window.__preloadChatCode = function () { want(chatCode); };
            }
            var params = new URLSearchParams(location.search);
            var room = params.get('room');
            var opensPublic = params.get('chat') === 'public' ||
              (!params.has('chat') && !params.has('with') && !window.matchMedia('(max-width: 1023px)').matches);
            if (!opensPublic || (room && room !== 'global') || !window.fetch ||
              (conn && conn.saveData) || localStorage.getItem('dehub_token') ||
              localStorage.getItem('dehub_refresh_token') || localStorage.getItem('dhb_kids_mode') === '1') return;
            var controller = new AbortController();
            var timer = setTimeout(function () { controller.abort(); }, 6000);
            window.__publicChatHistory = {
              at: Date.now(),
              promise: fetch('https://api.dehub.io/api/livechat/messages?limit=20&roomId=global', {
                headers: { Accept: 'application/json' }, cache: 'no-store', signal: controller.signal
              }).then(function (r) { return r.ok ? r.json() : null; })
                .catch(function () { return null; })
                .finally(function () { clearTimeout(timer); })
            };
            return;
          }
          if (code) want(code.r);
          if (!window.fetch) return;
          var ls = window.localStorage, h = { Accept: 'application/json' };
          var tok = ls.getItem('dehub_token');
          if (tok) {
            var exp = parseInt(ls.getItem('dehub_token_expires_at') || '', 10);
            if (!(exp > Date.now() + 5000)) return;
            h.Authorization = 'Bearer ' + tok;
          }
          if (ls.getItem('dhb_kids_mode') === '1') h['X-Kids-Mode'] = '1';
          window.__postPrefetch = {
            id: m[1],
            at: Date.now(),
            signedIn: !!tok,
            p: fetch('https://api.dehub.io/api/nft_info/' + m[1], { headers: h, cache: 'no-store' })
              .then(function (r) { return r.ok ? r.json() : null; })
              .then(function (j) {
                try {
                  var n = j && (j.result || j);
                  // Same test as the post page's getContentType.
                  if (code && n && (n.postType === 'live' || n.isLive !== undefined)) want(code.l);
                } catch (e) {}
                return j;
              })
              .catch(function () { return null; })
          };
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <!-- Apply the saved theme (+ dim settings) to <html> synchronously, during
         head parse — before the render-blocking stylesheet is matched and long
         before React mounts. ThemeContext also sets data-theme, but only in a
         PASSIVE effect that React defers under load, so a light-theme reload
         painted the dark default first: the sidebar's bg-zinc-* tiles flashed
         as ugly black boxes until the effect ran. Must be a classic (non-module)
         script so it runs inline at parse time, not deferred. Keys/migration/
         defaults mirror ThemeContext.tsx — keep them in sync. -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('dehub.theme') || 'system';
          if (t === 'christmas') t = 'winter'; // legacy name migration
          // Halloween 2026: Horror until local midnight unless this device opted
          // out by picking a theme (mirrors src/lib/halloween-override.ts).
          var now = new Date();
          if (now.getFullYear() === 2026 && now.getMonth() === 9 && now.getDate() === 31 &&
              localStorage.getItem('dehub.halloween2026.optOut') !== '1') t = 'horror';
          // System Light runs as System with a light tone (ThemeContext SYSTEM_LIGHT).
          var tone = t === 'system-light' ? 'light' : 'dark';
          if (tone === 'light') t = 'system';
          d.dataset.theme = t;
          d.dataset.systemTone = tone;
          // Post separator: thin lines instead of cards (src/lib/feed-separator.ts).
          if (localStorage.getItem('dehub.feedSeparator') === 'line') d.dataset.feedSep = 'line';
          // Own-line bubbles in General Chat (src/lib/chat-own-bubble.ts).
          if (localStorage.getItem('riftn.chat.ownBubble') === 'true') d.dataset.chatOwnBubble = '';
          d.dataset.shortsEnabled = localStorage.getItem('shorts-enabled') === 'false' ? 'false' : 'true';
          d.dataset.sidebarCollapsed = localStorage.getItem('sidebar-collapsed') === 'true' ? 'true' : 'false';

          // color-scheme is what the browser paints the CANVAS with — the
          // backdrop it shows for a document before that document's own styles
          // have painted, plus the scrollbars and the overscroll/rubber-band
          // area. Left undeclared it computes to `normal`, i.e. light, i.e.
          // WHITE, which is the flash on reload: nothing in the app's CSS can
          // prevent it, because it happens before any stylesheet applies. Eight
          // of the eleven themes (cosmic/hazy/swarms/lavalamp/winter/war/osaka/
          // jungle) make body AND #app-root `transparent !important` so their
          // canvas shows through, leaving <html> as the only thing that paints
          // — so on those the white canvas stays visible for the whole of that
          // window rather than being covered by an opaque body.
          d.style.colorScheme = t === 'light' || tone === 'light' ? 'light' : 'dark';

          // Paint the theme's own backdrop NOW, at head-parse time, rather than
          // waiting for the render-blocking stylesheet that normally carries it.
          // Values mirror the settled `background-color` of <html> per theme —
          // keep them in sync with index.css if a theme's backdrop changes.
          var BG = { glass: '#082a30', light: '#f9f8f4', osaka: '#0a0812', jungle: '#16110c' };
          d.style.setProperty('--boot-bg', tone === 'light' ? '#fff' : BG[t] || '#000');
          d.style.setProperty('--boot-fg', t === 'light' || tone === 'light' ? '#09090b' : '#fff');

          // An OBS browser source (/overlay/<token>, ObsOverlayPage). The page
          // is composited over somebody's live stream, so NOTHING may paint
          // but the widgets — not the backdrop, not the boot skeleton, and not
          // before the bundle arrives either, or every source refresh flashes
          // a black frame into the broadcast. color-scheme goes back to normal
          // because a dark scheme makes the browser paint the canvas itself.
          if (location.pathname.indexOf('/overlay/') === 0) {
            d.dataset.obsOverlay = 'on';
            d.style.setProperty('--boot-bg', 'transparent');
            d.style.colorScheme = 'normal';
          }

          d.dataset.dimLights = localStorage.getItem('dehub.dimLights') === '1' ? 'true' : 'false';
          var s = Number(localStorage.getItem('dehub.dimStrength'));
          if (!(s > 0)) s = 50;
          s = Math.min(100, s);
          d.style.setProperty('--dim-lights-opacity', (0.12 + 0.6 * (s / 100)).toFixed(3));

          // Frost the app shell from the FIRST painted frame (the sheet itself
          // is html[data-feed-loading] #root::after, in index.css), so the
          // welcome panel is the only thing that ever reads as sharp and
          // everything else — the boot skeleton, the sidebars, the theme
          // canvas — sits behind it out of focus.
          //
          // This must be set HERE, not from React. The first attempt drove it
          // off the home feed's isLoadingState, which is usually ALREADY FALSE
          // by the time HomeFeed first renders: the boot prefetch below starts
          // page 1 at parse time and use-unified-feed adopts it, and the
          // persisted query cache restores synchronously. So the frost almost
          // never appeared, and when it did the skeletons had already painted
          // sharp before React got there — the wrong order, which is the whole
          // point of the effect.
          //
          // FIRST VISIT ONLY, and it lifts on SCROLLING DOWN — never on a
          // timer. The frost exists to point a brand-new visitor at the welcome
          // panel; it has no job for anyone who has already seen it, so it is
          // skipped for a returning visitor, for anyone signed in, and for
          // anyone who has dismissed the panel. Those are the same conditions
          // under which HomeIntro itself declines to render, plus the
          // seen-it-once flag set below.
          //
          // `dehub_token` alone is NOT a signed-in test: it is the wallet/API
          // token, and a visitor authenticated through Supabase has none. That
          // mistake shipped once and made the panel flash for every Supabase
          // user, so the sb-* session is checked by SHAPE across all keys — the
          // project ref is a build-time value, the key can be relocated, and
          // supabase-js chunks a large session across `.0`/`.1`.
          // Desktop only — the blur read as an unexplained delay on mobile
          // first load with no payoff. 767px matches the mobile breakpoint
          // used elsewhere in index.css.
          // "Would HomeIntro render?" — shared by the prerendered panel below and
          // the frost. Signed in means an sb-* Supabase session OR a live wallet
          // token (see the note above on why dehub_token alone is not enough).
          var introDismissed = localStorage.getItem('dehub.homeIntroDismissed') === '1';
          var introSignedIn = false;
          for (var fi = 0; fi < localStorage.length; fi++) {
            var fk = localStorage.key(fi);
            if (fk && /^sb-.*-auth-token/.test(fk) && localStorage.getItem(fk)) { introSignedIn = true; break; }
          }
          if (!introSignedIn) {
            var ftk = localStorage.getItem('dehub_token');
            var fex = parseInt(localStorage.getItem('dehub_token_expires_at') || '0', 10);
            introSignedIn = !!ftk && (!fex || Date.now() < fex);
          }
          // The welcome panel is prerendered into the boot skeleton at build
          // (prerenderHomeIntroPlugin, vite.config.ts) so its plate — the page's
          // LCP element — paints with the first frame instead of after the
          // bundle. Hide it exactly when HomeIntro itself would return null.
          if (location.pathname !== '/' || introDismissed || introSignedIn) d.dataset.homeIntro = 'off';
          // The Moments seat (src/lib/story-shelf-seat.ts): the row of tiles,
          // or the ask bar when that is what Home showed last visit, or
          // nothing, so the posts do not move when the real one lands.
          var shelfSeat = localStorage.getItem('dehub.shelfShown');
          if (!/^\/(app)?\/?$/.test(location.pathname) || shelfSeat === '0') d.dataset.bootShelf = 'off';
          else if (shelfSeat === 'ask') d.dataset.bootShelf = 'ask';

          if (location.pathname === '/' && window.innerWidth > 767) {
            var skip = localStorage.getItem('dehub.introFrostSeen') === '1' || introDismissed || introSignedIn;

            if (!skip) {
              d.dataset.feedLoading = 'on';
              try { localStorage.setItem('dehub.introFrostSeen', '1'); } catch (e2) { /* one repeat is fine */ }

              var unfrost = function () {
                if (d.dataset.feedLoading !== 'on') return;
                d.dataset.feedLoading = 'off';
                // Past the 1.2s transition in index.css; the sheet is a
                // full-viewport backdrop-filter, so it has to stop existing
                // rather than merely go clear.
                setTimeout(function () { delete d.dataset.feedLoading; }, 1300);
              };

              // DOWNWARD scroll only. Reading the panel is the point, so moving
              // up or sideways must not clear it.
              //
              // MUST be null-safe on document.body. This script runs during
              // <head> parse, where document.body is still null — reading
              // `document.body.scrollTop` there threw a TypeError, the outer
              // try/catch swallowed it, and every line below (i.e. all of the
              // listeners) never ran. The frost went up and could never come
              // down. It looked fine in a test harness that passed a stub body
              // object; only a null one reproduces it.
              //
              // Measured on dehub.io: <body> is the scroller (overflow-y:auto,
              // scrollHeight 12419 vs clientHeight 720) while <html> does not
              // scroll at all, so window.scrollY and documentElement.scrollTop
              // both stay 0 forever and body.scrollTop is the only real value.
              var scrollTopNow = function () {
                var b = document.body;
                return window.scrollY || d.scrollTop || (b ? b.scrollTop : 0) || 0;
              };
              var lastY = 0; // nothing is scrolled at parse time
              var onScroll = function () {
                var y = scrollTopNow();
                if (y > lastY) unfrost();
                lastY = y;
              };
              // Capture phase: a scroll event on an element does not bubble, so
              // a listener on window never sees <body> scrolling without it.
              window.addEventListener('scroll', onScroll, { passive: true, capture: true });
              // And directly on the scroller once it exists, so the unfrost does
              // not hinge on that capture-phase subtlety being right.
              document.addEventListener('DOMContentLoaded', function () {
                if (document.body) document.body.addEventListener('scroll', onScroll, { passive: true });
              }, { once: true });
              // Wheel-down covers the gesture before any scrolling has actually
              // happened — a trackpad flick on a page still settling fires wheel
              // first, and the two agree on direction.
              window.addEventListener('wheel', function (e) {
                if (e.deltaY > 0) unfrost();
              }, { passive: true, capture: true });
              // A click anywhere outside the panel (a feed tab, the side menu)
              // means the visitor is off to use the app: clear the frost so
              // what they went to see is not left blurred. Clicks inside the
              // panel keep it, since reading the panel is the point.
              window.addEventListener('click', function (e) {
                var t = e.target;
                if (t && t.closest && t.closest('.dehub-intro')) return;
                unfrost();
              }, { capture: true });
            }
          }
        } catch (e) { /* never block boot */ }
      })();
    </script>

    <!-- Route-aware boot warming + feed prefetch.
         api.dehub.io (feed API, CORS fetch) and the DO Spaces CDN (post media) are
         contacted ONLY inside the app tree ("/" and "/app/*"). Warming them on
         light landing routes like /prompt, /docs or the SEO pages just opens
         sockets that are never used (DebugBear "resource hint not used" 7/15).
         Emitting the hints from this inline head script — which the parser runs
         before <body> — keeps them nearly as early as a static <link> on the
         routes that DO need them, and skips them everywhere else. Wallet origins
         (web3auth / web3modal / walletconnect) are warmed separately, on login
         intent (warmWalletOrigins in AuthProvider), so they no longer sit unused
         here either. Preview mirror hosts strip inline scripts — the app's hooks
         then connect normally, so the only loss is the head-start, never correctness. -->
    <script>
      (function () {
        try {
          var p = location.pathname;
          var isApp = p === "/" || p === "/app" || p.indexOf("/app/") === 0 || p === "/chat";

          if (isApp) {
            var head = document.head;
            var hint = function (rel, href, cors) {
              var l = document.createElement("link");
              l.rel = rel;
              l.href = href;
              if (cors) l.crossOrigin = "anonymous";
              head.appendChild(l);
            };
            // Feed API is hit at boot via fetch() (CORS) — the warmed socket is
            // reused only when the preconnect is crossorigin (DebugBear 7/14).
            hint("preconnect", "https://api.dehub.io", true);
            // Video files play straight from DO Spaces, but only after first
            // paint, so a DNS lookup is enough there (a full preconnect made
            // five, and PSI flags more than four).
            hint("dns-prefetch", "https://dehubcdn.ams3.cdn.digitaloceanspaces.com", false);
            // Posters and avatars come through the dehub.io image transform
            // (cdnImage in media-url.ts) as plain <img>, so no crossorigin.
            hint("preconnect", "https://dehub.io", false);
          }

          // Boot feed fetch: start the page-1 /api/feed request at parse time,
          // long before the entry bundle downloads and React mounts (LCP audit
          // 7/14: the hook-issued request didn't hit the wire until ~1.8s). The
          // promise is adopted by fetchUnifiedFeedFromAPI (use-unified-feed.ts)
          // only when the params match this exact default request; any mismatch,
          // error, or non-OK response resolves null and the hook fetches normally.
          // Gated to the default-feed routes only (deep /app/* routes request
          // different params, so they can't adopt this promise anyway).
          // The token is sent only while it is still live: /api/feed answers an
          // expired one with 200 and a body stripped of per-viewer fields
          // (isLiked…), which the SPA would cache as "this user liked nothing".
          // __DEHUB_FEED_VIEWER__ records whose engagement state this response
          // describes so the SPA refuses to adopt it for anyone else.
          // The welcome panel's silk plate. It is a CSS background set from an
          // inline style in HomeIntro, so the preload scanner cannot see it —
          // it is only discovered once React has rendered and styles resolve,
          // which is why the panel sat as an empty box while the sidebars (text
          // and inline SVG, zero requests) painted immediately. Hinting it here
          // puts it on the wire at parse time instead. Root only: that is the
          // one route the panel renders on.
          // Not via hint() above: that helper sets only rel/href, and a
          // rel="preload" without an `as` is ignored by the browser (and warns).
          if (p === "/") {
            var plate = document.createElement("link");
            plate.rel = "preload";
            plate.as = "image";
            plate.href = "/brand-kit/bg/bg-16.jpg";
            // Phones never show this plate: they draw the inline crop below.
            if (!window.matchMedia("(max-width: 639px)").matches) document.head.appendChild(plate);
          }

          if (p === "/" || p === "/app" || p === "/app/") {
            // No Content-Type: a bodyless GET with one needs a CORS preflight.
            var h = { "Accept": "application/json" };
            var t = localStorage.getItem("dehub_token");
            var exp = parseInt(localStorage.getItem("dehub_token_expires_at") || "0", 10);
            var live = !!t && (!exp || Date.now() < exp);
            if (live) h["Authorization"] = "Bearer " + t;
            window.__DEHUB_FEED_VIEWER__ = live
              ? (localStorage.getItem("dehub_wallet") || "").toLowerCase() || null
              : null;
            window.__DEHUB_FEED__ = fetch(
              "https://api.dehub.io/api/feed?page=1&limit=10&sortBy=createdAt&sortOrder=desc&status=all",
              { headers: h }
            ).then(function (r) { return r.ok ? r.json() : null; })

    <!-- Noto Color Emoji: fills the gaps in the platform emoji font (Windows has
         no flag glyphs, older Segoe UI Emoji misses recent codepoints). Google
         serves it as ~10 unicode-range subsets, so a browser downloads only the
         chunk for an emoji it can't already draw — and nothing at all on
         Android/macOS, where the system font wins earlier in the stack.
         Deferred to idle-after-load rather than preloaded alongside Manrope. On
         Windows the subsets it actually picks are big — a real load of
         dehub.io in Aug 2026 pulled 693 KB + 135 KB of woff2 — and spending
         that during the load window costs bandwidth for glyphs that are, by
         definition, never the largest contentful paint. `display=swap` already
         means emoji paint in the platform font first and upgrade on arrival,
         so deferring changes only WHEN the upgrade lands, not whether.
         Windows only: it is the one platform whose emoji font has the gaps
         this fills. Android, iOS and macOS never used the download, and Linux
         (which is what Lighthouse and most headless audits run as) pulled the
         whole set — 694 KB on the 2026-09-02 run — to draw a handful of
         glyphs the monochrome fallback handles fine. -->
    <script>
      (function () {
        if (!/Windows/.test(navigator.userAgent)) return;
        var href = 'https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap';
        function loadEmojiFont() {
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = href;
          document.head.appendChild(l);
        }
        // Idle callback keeps it off the tail of the load event too, so it
        // never competes with the app's own post-load work. The timeout is the
        // guarantee it still happens on a permanently busy main thread.
        function schedule() {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadEmojiFont, { timeout: 3000 });
          } else {
            setTimeout(loadEmojiFont, 1200);
          }
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
      })();
    </script>
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" />
    </noscript>

    <!-- Critical CSS — prevents the pre-stylesheet flash.
         Colours come from --boot-bg / --boot-fg, set per theme by the head
         script above, so this no longer hard-codes #000 for all eleven themes:
         that made the light theme flash BLACK on every reload, the same bug in
         the other direction. The fallbacks in var() cover the stripped-script
         case. -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; width: 100%; background-color: var(--boot-bg, #000); color: var(--boot-fg, #fff); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #root { height: 100%; min-height: 100dvh; background-color: var(--boot-bg, #000); }
      /* OBS browser source: transparent all the way down, whatever a theme's
         stylesheet says later, and none of the app's chrome or toasts. */
      html[data-obs-overlay][data-obs-overlay],
      html[data-obs-overlay][data-obs-overlay] body,
      html[data-obs-overlay][data-obs-overlay] #root { background: transparent !important; overflow: hidden !important; }
      html[data-obs-overlay] .bskel,
      html[data-obs-overlay] [data-sonner-toaster] { display: none !important; }

      /* --- Boot skeleton ------------------------------------------------
         The three-column app shell, painted at parse time with no JavaScript,
         so the FIRST frame is already a complete-looking page. Without it the
         middle column is empty until React mounts while the rails arrive with
         the bundle, and the page reads as "a panel is missing" and then jumps
         to filled.

         It lives INSIDE #root, which is what removes it: createRoot() clears
         its container on the first render, so React swaps the skeleton for the
         real tree in one commit with no hand-off code to get wrong. Nothing
         here is ever seen by a screen reader or a crawler — it is empty divs.

         Sizes mirror the real shell so the swap does not shift: rail widths
         from navigation/DesktopSidebar (60/231px, lg-only), the right rail from
         PageSkeletons' own HomeRightSidebarSkeleton (w-72/xl:w-80, 288/320px), the 80rem
         cap and mx-auto from AppLayout, and the tab-bar block from HomePage's
         sticky bar (35px buttons inside pt-1 pb-2 / sm:pb-3 / lg:pt-2).

         It sits under the frost sheet (#root::after, z-120) with no z-index of
         its own, so it is blurred like everything else while the welcome panel
         above it stays sharp. */
      .bskel { display: flex; width: 100%; max-width: 80rem; margin: 0 auto; }
      /* The rails must be DRAWN, not merely reserved. They shipped as empty
         width-only spacers, so the first frame was middle blocks floating in
         two blank gutters — and the "side panel skeletons" a visitor actually
         saw were React's real sidebars arriving later, by which time this
         skeleton had already been cleared. That is the gap that read as the
         middle loading out of step with the sides. */
      .bskel-rail, .bskel-rrail { display: none; flex: none; }
      /* riftn.com/chat has no rails or feed: it waits as a chat list beside an
         empty chat, the shape of FullScreenChatShell. The script before #root
         picks it. */
      .bskel-chat { display: none; position: fixed; inset: 0; }
      html[data-boot-chat] .bskel { display: none; }
      html[data-boot-chat] .bskel-chat { display: flex; }
      .bskel-chat-list { width: 100%; padding-top: 12px; }
      .bskel-chat-top { height: 48px; margin: 0 12px 12px; border-radius: 16px; background: var(--bskel, rgba(255,255,255,.07)); }
      .bskel-chat-row { height: 80px; padding: 16px; display: flex; align-items: center; gap: 12px; }
      .bskel-chat-row::before { content: ''; flex: none; width: 48px; height: 48px; border-radius: 8px; background: var(--bskel, rgba(255,255,255,.07)); }
      .bskel-chat-row::after { content: ''; width: 55%; height: 14px; border-radius: 4px; background: var(--bskel, rgba(255,255,255,.07)); }
      @media (min-width: 768px) {
        .bskel-chat-list { flex: none; width: clamp(18rem, 30vw, 26.5rem); border-right: 1px solid rgba(255,255,255,.07); }
      }
      .bskel-wash { background: var(--bskel, rgba(255,255,255,.07)); border-radius: 4px; }
      .bskel-logo { height: 41px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
      .bskel-sidebar { height: calc(100dvh - 123px); padding: 10px; border-radius: 16px; background: var(--bskel-surface, #18181b); overflow: hidden; }
      .bskel-navrow { height: 58px; display: flex; align-items: center; gap: 12px; }
      .bskel-navrow::before { content: ''; width: 36px; height: 36px; border-radius: 10px; background: var(--bskel, rgba(255,255,255,.07)); }
      .bskel-navrow::after { content: ''; width: 72px; height: 14px; border-radius: 4px; background: var(--bskel, rgba(255,255,255,.07)); }
      .bskel-create { height: 46px; margin-top: 12px; border-radius: 16px; background: var(--bskel, rgba(255,255,255,.07)); }
      .bskel-panel { height: 438px; margin-bottom: 16px; padding: 12px; border-radius: 16px; background: var(--bskel-surface, #18181b); }
      .bskel-panel:last-child { height: 414px; }
      .bskel-panel-tabs { display: flex; justify-content: space-around; margin: 0 0 24px; }
      .bskel-panel-tabs > div { width: 20px; height: 20px; }

      .bskel-main { flex: 1 1 auto; min-width: 0; width: 100%; padding-top: 44px; }
      /* Bottom margins are one px over the tab bar's: measured on the live
         site, the app's welcome panel sits at y=92 (phone) / y=56 (desktop)
         and the prerendered one in this skeleton sat one px above both. */
      .bskel-tabs { height: 35px; margin: 4px 8px 9px; border-radius: 12px; background: var(--bskel, rgba(255,255,255,.06)); }
      .bskel-tabs { height: 35px; margin: 4px 8px 13px; border-radius: 12px; background: var(--bskel-nav, var(--bskel-surface, #18181b)); display: flex; align-items: center; }
      .bskel-tabs > div { flex: 1; display: flex; justify-content: center; }

                    border: 1px solid var(--bskel-b, rgba(255,255,255,.08)); }
